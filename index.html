    <script>
      // Fix file:// - history.replaceState/pushState SecurityError
      (function() {
        var _origReplace = history.replaceState.bind(history);
        var _origPush = history.pushState.bind(history);
        function safe(orig) {
          return function(state, title, url) {
            try { return orig(state, title, url); } catch(e) { /* ignore SecurityError on file:// */ }
          };
        }
        history.replaceState = safe(_origReplace);
        history.pushState = safe(_origPush);
      })();

      // Suprime mensagens e erros chatos de Firebase/analíticos no modo offline
      (function() {
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(arg => {
            if (arg && (arg instanceof Error || typeof arg.message === 'string')) {
              return (arg.name || 'Error') + ': ' + arg.message + ' ' + (arg.stack || '');
            }
            try {
              return typeof arg === 'string' ? arg : JSON.stringify(arg);
            } catch(e) {
              return String(arg);
            }
          }).join(' ');

          if (
            msg.includes('@firebase/firestore') ||
            msg.includes('@firebase/analytics') ||
            msg.includes('FirebaseError') ||
            msg.includes('Failed to get document') ||
            msg.includes('Failed to fetch') ||
            msg.includes('service worker') ||
            msg.includes('Error during service worker')
          ) {
            return;
          }
          return _origConsoleError.apply(this, arguments);
        };

        const _origConsoleWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(arg => {
            if (arg && (arg instanceof Error || typeof arg.message === 'string')) {
              return (arg.name || 'Error') + ': ' + arg.message + ' ' + (arg.stack || '');
            }
            try {
              return typeof arg === 'string' ? arg : JSON.stringify(arg);
            } catch(e) {
              return String(arg);
            }
          }).join(' ');

          if (
            msg.includes('Cloud Firestore') ||
            msg.includes('Firestore') ||
            msg.includes('SW falhou') ||
            msg.includes('service worker')
          ) {
            return;
          }
          return _origConsoleWarn.apply(this, arguments);
        };
      })();

      // Desativa Service Workers localmente para evitar erros de importação e problemas com cache.
      // Oculta completamente 'serviceWorker' do operador 'in' e das consultas diretas usando Proxy no navigator.
      try {
        const origNavigator = window.navigator;
        const navProxy = new Proxy(origNavigator, {
          has(target, prop) {
            if (prop === 'serviceWorker') return false;
            return prop in target;
          },
          get(target, prop) {
            if (prop === 'serviceWorker') return undefined;
            const val = target[prop];
            if (typeof val === 'function') {
              return val.bind(target);
            }
            return val;
          }
        });
        Object.defineProperty(window, 'navigator', {
          get: function() { return navProxy; },
          configurable: true,
          enumerable: true
        });
      } catch(e) {}

      // Bloqueia requests de permissão (notificações, dispositivos)
      if (window.Notification) {
        Notification.requestPermission = function() { return Promise.resolve('denied'); };
      }

      // Bloqueia sendBeacon (analytics/telemetria)
      navigator.sendBeacon = function() { return false; };

      // Helper para verificar se a URL é permitida (local)
      function isAllowedUrl(urlInput) {
        if (!urlInput) return true;

        // Converte para string se for objeto (ex: URL, TrustedScriptURL, etc.)
        let urlStr = '';
        if (typeof urlInput === 'string') {
          urlStr = urlInput;
        } else if (urlInput && typeof urlInput === 'object') {
          if (urlInput instanceof URL) {
            urlStr = urlInput.href;
          } else if (typeof urlInput.url === 'string') {
            urlStr = urlInput.url;
          } else if (typeof urlInput.toString === 'function') {
            urlStr = urlInput.toString();
          }
        } else {
          try {
            urlStr = String(urlInput);
          } catch(e) {
            return false;
          }
        }

        // URLs relativas são sempre permitidas
        if (!urlStr.startsWith('http:') && !urlStr.startsWith('https:') && !urlStr.startsWith('//')) {
          return true;
        }
        // Normaliza URLs com //
        let resolvedUrl = urlStr;
        if (urlStr.startsWith('//')) {
          resolvedUrl = window.location.protocol + urlStr;
        }
        try {
          const parsed = new URL(resolvedUrl);
          // Permite apenas se for o mesmo host (evita telemetria no localhost/outros hosts externos)
          return parsed.host === window.location.host;
        } catch(e) {
          return false;
        }
      }

      // Helper para retornar uma URL de mock segura e silenciosa
      function getMockSrc(tag) {
        const t = typeof tag === 'string' ? tag.toLowerCase() : '';
        if (t === 'img') {
          return 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; // 1x1 transparente
        }
        if (t === 'script') {
          return 'data:application/javascript,//blocked'; // script válido e inofensivo que não quebra no browser
        }
        return 'data:text/plain,blocked';
      }

      // Bloqueia a criação de elementos DOM externos (scripts, iframes, imagens, links de telemetria)
      const _origCreateElement = document.createElement;
      document.createElement = function(tagName, options) {
        const el = _origCreateElement.apply(this, arguments);
        if (typeof tagName === 'string') {
          const tag = tagName.toLowerCase();
          if (tag === 'script' || tag === 'iframe' || tag === 'img' || tag === 'link') {
            const _origSetAttribute = el.setAttribute;
            el.setAttribute = function(name, value) {
              if (typeof name === 'string' && name.toLowerCase() === 'src') {
                if (!isAllowedUrl(value)) {
                  console.log(`[offline] DOM ${tag} bloqueado:`, value);
                  value = getMockSrc(tag);
                }
              }
              return _origSetAttribute.call(this, name, value);
            };
            Object.defineProperty(el, 'src', {
              get: function() {
                return el.getAttribute('src') || '';
              },
              set: function(val) {
                if (!isAllowedUrl(val)) {
                  console.log(`[offline] DOM ${tag} bloqueado:`, val);
                  val = getMockSrc(tag);
                }
                el.setAttribute('src', val);
              },
              configurable: true
            });
          }
        }
        return el;
      };

      // Bloqueia todas as requisições externas para funcionar offline
      const _origFetch = window.fetch;
      window.fetch = function(input, init) {
        let urlStr = '';
        if (typeof input === 'string') {
          urlStr = input;
        } else if (input && typeof input === 'object') {
          if (input instanceof URL) {
            urlStr = input.href;
          } else if (typeof input.url === 'string') {
            urlStr = input.url;
          } else if (typeof input.toString === 'function') {
            urlStr = input.toString();
          }
        }

        if (!isAllowedUrl(urlStr)) {
          console.log('[offline] fetch bloqueado:', urlStr);
          return Promise.reject(new TypeError('Failed to fetch'));
        }
        return _origFetch.apply(this, arguments);
      };

      const _origXHR = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        let urlStr = '';
        if (typeof url === 'string') {
          urlStr = url;
        } else if (url && typeof url === 'object') {
          if (url instanceof URL) {
            urlStr = url.href;
          } else if (typeof url.toString === 'function') {
            urlStr = url.toString();
          }
        }

        if (!isAllowedUrl(urlStr)) {
          console.log('[offline] XHR bloqueado:', urlStr);
          url = 'data:text/plain,blocked';
        }
        return _origXHR.apply(this, arguments);
      };
    </script>
